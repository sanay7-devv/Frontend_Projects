<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"> <!--always write this as it may cause errors-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Login</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <script src="https://kit.fontawesome.com/dd13cfd462.js" crossorigin="anonymous"></script>
</head>
<!--the containers ids and classes are quite important to understand so better understand them -->
<!--they have to be systematic then only css can be applied on them-->

<body>
    <div class="container">
        <!--this is rightside -->
        <div class="signew">
            <h1>Hello, Friend!</h1>
            <p>Enter your personal details and start the journey with us</p>
            <button id = "signupbtn" >Sign up</button>
        </div>
        <div class="signup">
            <form action="#">
                <h1>Create Account</h1>
                <div class="icons">
                    <!--icons from font awesome need another course for fontawesome icons -->
                    <a href="https://www.facebook.com/" class="icon" id="ic1"><i
                            class="fa-brands fa-facebook-f"></i></a>
                    <a href="https://www.google.com/" class="icon" id="ic2"><i class="fa-brands fa-google"></i></a>
                    <a href="https://www.linkedin.com/" class="icon" id="ic3"><i
                            class="fa-brands fa-linkedin-in"></i></a>
                </div>
                <text>or use your email for registration</text>
                <br>
                <input type="text" placeholder="Name" name="name">
                <br>
                <input type="email" placeholder="Email">
                <br>
                <input type="password" placeholder="Password">
                <br>
                <button type="submit">SIGN UP</button>
            </form>
        </div>
        <!--this is leftside -->
        <div class="welcomeback">
            <h1>Welcome, Back!</h1>
            <p>To acess the services please login through your personal details</p>
            <button id ="signinbtn" type="submit">Sign In</button>
        </div>
        <div class="signin">
            <form action="#">
                <h1>Sign in</h1>
                <div class="icons">
                    <!--icons from font awesome need another course for fontawesome icons -->
                    <a href="https://www.facebook.com/" class="icon" id="ic1"><i
                            class="fa-brands fa-facebook-f"></i></a>
                    <a href="https://www.google.com/" class="icon" id="ic2"><i class="fa-brands fa-google"></i></a>
                    <a href="https://www.linkedin.com/" class="icon" id="ic3"><i
                            class="fa-brands fa-linkedin-in"></i></a>
                </div>
                <text>or use your account</text>
                <br>
                <input type="email" placeholder="Email" name="email">
                <br>
                <input type="password" placeholder="Password" name="password">
                <br>
                <a href="#">Forgot your password</a>
                <br>
                <button type="submit">Sign In</button>
            </form>
        </div>

    </div>
    <!-- for getting the icons of facebook google and linkedin we have to use this-->
    <script src="script.js">
    </script>
</body>

</html>
